[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synth-agent-economy"
version = "1.0.0"
description = "Autonomous Agent Macro-Economic Settlement Layer, Synthetic Capital Markets & Flash Corporations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Autonomous Agent Economy Contributors", email = "contributors@synth-agent-economy.org"}
]
dependencies = [
    "rich>=13.0.0"
]

[project.scripts]
synth-agent-economy = "synth_agent_economy.cli.main:main"

